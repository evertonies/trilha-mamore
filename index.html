const MEM = "trilha-mamore:chave";
const bin = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

async function chaveDaSenha(senha) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(senha), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: bin(P.sal), iterations: P.it, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
async function abrir(chave) {
  const claro = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bin(P.iv) }, chave, bin(P.dados));
  const txt = await new Response(new Blob([claro]).stream().pipeThrough(new DecompressionStream("gzip"))).text();
  // mantém o app instalável e com ícone depois de abrir
  const cab = '<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="theme-color" content="#1E1E1E"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Trilha">';
  document.open(); document.write(txt.replace(/<head>/i, "<head>" + cab)); document.close();
}
const msg = t => { document.getElementById("msg").textContent = t; };

(async () => {
  if (!window.crypto || !crypto.subtle || typeof DecompressionStream === "undefined") { msg("Este navegador é antigo demais. Atualize o Chrome ou o Safari."); document.getElementById("b").disabled = true; return; }
  try {
    const g = JSON.parse(localStorage.getItem(MEM) || "null");
    if (g && g.sal === P.sal) { const k = await crypto.subtle.importKey("raw", bin(g.k), "AES-GCM", false, ["decrypt"]); await abrir(k); return; }
    if (g) localStorage.removeItem(MEM); // senha trocada: pede de novo
  } catch (e) { localStorage.removeItem(MEM); }
  document.getElementById("s").focus();
})();

document.getElementById("f").onsubmit = async e => {
  e.preventDefault();
  const b = document.getElementById("b"); b.disabled = true; msg("Abrindo…");
  try {
    const lembrar = document.getElementById("lembrar").checked; // ler antes: abrir() substitui a página
    const k = await chaveDaSenha(document.getElementById("s").value);
    const bruta = await crypto.subtle.exportKey("raw", k);
    await abrir(k);
    try { if (lembrar) localStorage.setItem(MEM, JSON.stringify({ sal: P.sal, k: b64(bruta) })); } catch (e2) {}
  } catch (err) { b.disabled = false; msg("Senha incorreta."); document.getElementById("s").select(); }
};
</script>
